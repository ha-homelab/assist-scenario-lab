<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Offline data flow</title><desc id="desc">No microphone capture, network client or device control is included.</desc><rect width="1100" height="350" fill="#f4f6f2"/><g font-family="sans-serif" fill="#15261e"><text x="40" y="55" font-size="27">Offline data flow</text><text x="40" y="88" font-size="16">No microphone capture, network client or device control is included.</text><rect x="40" y="125" width="320" height="175" rx="14" fill="#fff" stroke="#276c50" stroke-width="2"/><text x="58" y="159" font-size="20">Private input</text><text x="58" y="194" font-size="15">Single-run HA event array</text><text x="58" y="220" font-size="15">or canonical session manifest</text><text x="58" y="246" font-size="15">Keep raw data outside Git</text><text x="367" y="222" font-size="22">→</text><rect x="390" y="125" width="320" height="175" rx="14" fill="#fff" stroke="#276c50" stroke-width="2"/><text x="408" y="159" font-size="20">Bounded validation</text><text x="408" y="194" font-size="15">Strip every HA event payload</text><text x="408" y="220" font-size="15">Separate clock + evidence methods</text><text x="408" y="246" font-size="15">Reject malformed / mixed inputs</text><text x="717" y="222" font-size="22">→</text><rect x="740" y="125" width="320" height="175" rx="14" fill="#fff" stroke="#276c50" stroke-width="2"/><text x="758" y="159" font-size="20">Reviewable output</text><text x="758" y="194" font-size="15">JSON, HTML and JUnit</text><text x="758" y="220" font-size="15">Stable failure / pending codes</text><text x="758" y="246" font-size="15">Synthetic label stays visible</text></g></svg>
