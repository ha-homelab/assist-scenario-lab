<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Three different evidence layers</title><desc id="desc">A completed pipeline cannot prove what a person heard.</desc><rect width="1100" height="350" fill="#f4f6f2"/><g font-family="sans-serif" fill="#15261e"><text x="40" y="55" font-size="27">Three different evidence layers</text><text x="40" y="88" font-size="16">A completed pipeline cannot prove what a person heard.</text><rect x="40" y="125" width="320" height="175" rx="14" fill="#fff" stroke="#276c50" stroke-width="2"/><text x="58" y="159" font-size="20">Protocol</text><text x="58" y="194" font-size="15">run-start → run-end</text><text x="58" y="220" font-size="15">TTS ready is an API milestone</text><text x="58" y="246" font-size="15">No audio completion inference</text><text x="367" y="222" font-size="22">→</text><rect x="390" y="125" width="320" height="175" rx="14" fill="#fff" stroke="#276c50" stroke-width="2"/><text x="408" y="159" font-size="20">Observed action</text><text x="408" y="194" font-size="15">Expected intent checked</text><text x="408" y="220" font-size="15">HA state or operator observation</text><text x="408" y="246" font-size="15">State is not physical proof</text><text x="717" y="222" font-size="22">→</text><rect x="740" y="125" width="320" height="175" rx="14" fill="#fff" stroke="#276c50" stroke-width="2"/><text x="758" y="159" font-size="20">Audible response</text><text x="758" y="194" font-size="15">Operator or acoustic observation</text><text x="758" y="220" font-size="15">Explicit request-to-audible timing</text><text x="758" y="246" font-size="15">Unknown remains incomplete</text></g></svg>
