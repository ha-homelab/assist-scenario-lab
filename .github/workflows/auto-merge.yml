name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_run:
    workflows: ["Auto Approve PRs", "Check", "CodeQL"]
    types: [completed]
  status:
  check_run:
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:


# Metadata-only edits must not cancel a meaningful pending approval/merge run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) && github.run_id || (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
         github.event.pull_request.user.login == 'dependabot[bot]'))) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      (contains(github.event.pull_request.labels.*.name, 'automerge') ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'automerge'))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@427a937de66be398d624822e1af558c0e019e0df # main
    with:
      reviewed-merge: true
      reviewed-single-pass: true
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: check,secrets
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}

  recover-auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: automerge-reviewed-recovery-${{ github.repository }}
      cancel-in-progress: false
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@427a937de66be398d624822e1af558c0e019e0df # main
    with:
      reviewed-merge: true
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: "check,secrets"
      reviewed-single-pass: true
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
