name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

# Metadata-only edits must not cancel a meaningful pending approval/merge run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
         github.event.pull_request.user.login == 'dependabot[bot]'))) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      (contains(github.event.pull_request.labels.*.name, 'automerge') ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'automerge'))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@f77820983e4279471224b8443980f55448183872
    with:
      reviewed-merge: true
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: check,secrets
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
