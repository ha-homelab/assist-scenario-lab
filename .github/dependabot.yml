version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Keep init, autobuild, analyze and SARIF upload on one release.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
